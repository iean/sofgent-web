<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="AI document automation pipeline mockup">
  <defs>
    <linearGradient id="doc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1512"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <radialGradient id="doc-glow" cx="0.3" cy="0" r="0.9">
      <stop offset="0" stop-color="#326d6d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#326d6d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#doc-bg)"/>
