  <rect x="588" y="556" width="404" height="72" rx="12" fill="rgba(40,200,64,0.1)" stroke="rgba(40,200,64,0.3)"/>
  <circle cx="618" cy="592" r="14" fill="rgba(40,200,64,0.2)"/>
  <path d="M611 592 l5 5 l9 -10" fill="none" stroke="#28c840" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="648" y="586" fill="#fff" font-family="sans-serif" font-size="14" font-weight="600">Routed → accounts-payable</text>
  <text x="648" y="608" fill="rgba(255,255,255,0.45)" font-family="sans-serif" font-size="12">Processed in 1.2s · no manual review</text>
