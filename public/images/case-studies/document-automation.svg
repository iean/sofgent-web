  <rect x="112" y="222" width="420" height="436" rx="14" fill="#f4f4f0" opacity="0.95"/>
  <rect x="146" y="258" width="200" height="16" rx="4" fill="#0c0c0c" opacity="0.75"/>
  <rect x="146" y="292" width="352" height="8" rx="4" fill="#0c0c0c" opacity="0.2"/>
  <rect x="146" y="312" width="352" height="8" rx="4" fill="#0c0c0c" opacity="0.2"/>
  <rect x="146" y="332" width="280" height="8" rx="4" fill="#0c0c0c" opacity="0.2"/>
  <rect x="146" y="378" width="150" height="10" rx="4" fill="#326d6d" opacity="0.5"/>
