    <rect x="536" y="150" width="180" height="40" rx="20" fill="rgba(50,109,109,0.28)" stroke="rgba(103,232,249,0.4)"/>
    <text x="626" y="175" text-anchor="middle" fill="#67e8f9" font-weight="600">Extract</text>
    <text x="732" y="175" text-anchor="middle" fill="#326d6d" font-size="18">→</text>
    <rect x="748" y="150" width="180" height="40" rx="20" fill="rgba(255,255,255,0.05)"/>
    <text x="838" y="175" text-anchor="middle" fill="rgba(255,255,255,0.7)">Validate</text>
    <text x="944" y="175" text-anchor="middle" fill="#326d6d" font-size="18">→</text>
    <rect x="960" y="150" width="60" height="40" rx="20" fill="rgba(40,200,64,0.18)"/>
    <text x="990" y="175" text-anchor="middle" fill="#28c840">Route</text>
